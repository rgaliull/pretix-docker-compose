services:
  app:
    container_name: pretix_app
    build:
      dockerfile: Dockerfile
      context: ./docker/pretix
    restart: always
    depends_on:
      - database
      - cache
    volumes:
      - pretix_data:/data
      - ./pretix.cfg:/etc/pretix/pretix.cfg
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./crontab:/tmp/crontab
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend

  database:
    image: postgres:16.15-alpine3.24
    container_name: pretix_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:8.10.1-alpine3.23
    container_name: redis
    ports:
      - "5672:6379"
    restart: always
    networks:
      - backend

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:?POSTGRES_DATA_VOLUME is required}
  pretix_data:
    external: true
    name: ${PRETIX_DATA_VOLUME:?PRETIX_DATA_VOLUME is required}

networks:
  backend:
    external: false
